directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/sdf/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [-1.57]
        iiwa_joint_2: [0.1]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [ 1.6]
        iiwa_joint_7: [0]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
    # X_PC:
    #     translation: [0, -0.5, 0]
    #     rotation: !Rpy { deg: [0, 0, 180] }
- add_model:
    name: wsg
    file: package://manipulation/hydro/schunk_wsg_50_with_tip.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}
        
        
- add_model:
    name: table
    file: file:///workspaces/6.4210-final-project/sdfs/table.sdf
- add_weld:
    parent: world
    child: table::table_link
    X_PC:
        translation: [0.0, 0.0, -0.05]
        rotation: !Rpy { deg: [0, 0, -90] }
        
- add_model:
    name: ball
    file: file:///workspaces/6.4210-final-project/sdfs/sphere.sdf
    default_free_body_pose:
        body_link:
            translation: [0.55, 0, 0.00]
            rotation: !Rpy { deg: [0, 0, 0] }

- add_model:
    name: hoop_model
    file: file:///workspaces/6.4210-final-project/sdfs/basketball_hoop.sdf
- add_weld:
    parent: world
    child: hoop_model::base_link_hoop  
    X_PC:
        translation: [0, -5, 3.048]
        rotation: !Rpy { deg: [0, 0, 90] }

- add_model:
        name: obstacle_back
        file: file:///workspaces/6.4210-final-project/sdfs/obstacle.sdf

- add_weld:
    parent: world
    child: obstacle_back::link  
    X_PC:
        translation: [0, 1, 0]
        rotation: !Rpy { deg: [90, 0, 0] }

- add_model:
    name: obstacle_front
    file: file:///workspaces/6.4210-final-project/sdfs/obstacle.sdf

- add_weld:
    parent: world
    child: obstacle_front::link  
    X_PC:
        translation: [0, -1, 0]
        rotation: !Rpy { deg: [90, 0, 0] }

- add_model:
    name: obstacle_left
    file: file:///workspaces/6.4210-final-project/sdfs/obstacle.sdf

- add_weld:
    parent: world
    child: obstacle_left::link  
    X_PC:
        translation: [1, 0, 0]
        rotation: !Rpy { deg: [90, 0, 0] }

